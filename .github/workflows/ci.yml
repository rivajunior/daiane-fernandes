name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: pnpm audit --prod
      - run: vp run typecheck
      - run: vp check
      - run: vp run test
      - run: echo "POW_SECRET=ci-only-secret" > .dev.vars
      - run: vp run build
      - run: vp exec playwright install --with-deps chromium
      - run: vp run test:e2e
        env:
          CI: "true"
      - run: vp run lhci
